# config.example.toml — template for non-secret behavioral configuration (spec Decision 10)
#
# Copy to config.toml and adjust as needed; config.toml is excluded by .gitignore and never enters the repo.
# Secrets (LLM_API_KEY / CAPSOLVER_API_KEY / IMAP password, etc.) do not go here — see .env.example.

[deliver]
# Delivery mode: manual (default, pauses at READY_TO_SUBMIT for each job to await confirmation) / auto (submits automatically)
mode = "manual"
# Timeout in seconds while waiting for the user to answer a blocking question (WAITING_USER); on timeout the job moves to SUSPENDED and the run continues with the next one
question_timeout = 1800
# Easy Apply (LinkedIn) rolling 24-hour application cap; once hit, falls back to applying via the company site or queues for the next day (not triggered by the current Workday-only MVP)
easy_apply_daily_limit = 50
# Password generation mode: random (randomly generated) / template (generated from a template rule), used for auto-registration during AUTHENTICATING
password_generation_mode = "random"
# Password template used in template mode; "{rand}" is replaced with a random alphanumeric string; ignored in random mode
password_template = "Deliver{rand}!2026"

[llm]
# Command for invoking the headless CLI subprocess (Decision 4: the first LLMClient implementation runs a headless CLI).
#
# ⚠️ Key constraint: the command must write the 【raw PageDecision JSON】 to stdout — that single
# {"decisions": [...], "next_action": ...} object itself (optionally wrapped in a ```json code fence,
# with explanatory text before/after being fine — the parser extracts the object). It **cannot** be an
# "agent envelope" that wraps the decision in another layer. In particular, `claude -p --output-format json` produces
# Claude Code's result envelope {"type":"result","result":"...(decision JSON escaped into a string)..."},
# where the decision JSON is hidden inside the result string with no top-level decisions/next_action field,
# so the parser rejects it → every page gets llm_decision_error. That's why the default is `claude -p`
# without --output-format: it writes the model's text reply straight to stdout, and the system prompt already
# requires the model to reply with nothing but a single PageDecision JSON object, which satisfies the
# constraint above exactly. The same applies to any other CLI (Gemini CLI, a local-model wrapper script,
# etc.) — as long as its stdout is the raw decision JSON.
#
# If the command string contains a "{model}" placeholder it gets substituted with the model value below, e.g.
# command = "claude -p --model {model}"; when there's no placeholder, model is still passed to the subprocess via
# the LLM_MODEL environment variable — how it's used is up to the command itself.
command = "claude -p"
# Model name, passed to the CLI alongside command (see above)
model = "claude-opus-4-8"
# Optional: a custom endpoint for pluggable LLMs (Decision 10's model+base_url+key); not a secret,
# passed through to the CLI subprocess via the LLM_BASE_URL environment variable as needed; leave blank to use command's own default
# base_url = ""
# Timeout in seconds for a single decide() call, so a hung CLI subprocess doesn't stall the whole run
timeout = 60

[browser]
# Run headless; set to false during debugging to watch Playwright's actual behavior in a headed browser (Decision 3)
headless = true
# Persistent profile directory (reuses cookies/login state); resolved relative to the repo root; lives under data/ so it's gitignored
user_data_dir = "data/browser_profile"

[imap]
# Read-only mailbox, used to automatically retrieve registration verification codes/links (PRD 6)
host = "imap.gmail.com"
port = 993
# Mailbox folder opened read-only (SELECT/EXAMINE)
mailbox = "INBOX"
# Poll interval and total timeout (seconds) for fetch_code/fetch_link; degrades gracefully on timeout (PRD 5: never blocks the overall pipeline)
poll_interval = 5.0
poll_timeout = 120.0

[capsolver]
# CapSolver captcha-solving service (Decision 6 sub-step: detect type+sitekey → createTask → poll → inject)
# The CAPSOLVER_API_KEY secret goes through an environment variable/.env, not here; captcha handling fails gracefully when unconfigured (PRD 5)
base_url = "https://api.capsolver.com"
poll_interval = 2.0
poll_timeout = 120.0
