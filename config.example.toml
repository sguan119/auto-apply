# config.example.toml — template for non-secret behavioral configuration (spec Decision 10)
#
# Copy to config.toml and adjust as needed; config.toml is excluded by .gitignore and never enters the repo.
# Secrets (LLM_API_KEY / CAPSOLVER_API_KEY / IMAP password, etc.) do not go here — see .env.example.

[deliver]
# Delivery mode: manual (default, pauses at READY_TO_SUBMIT for each job to await confirmation) / auto (submits automatically)
mode = "manual"
# Timeout in seconds while waiting for the user to answer a blocking question (WAITING_USER); on timeout the job moves to SUSPENDED and the run continues with the next one
question_timeout = 1800
# Easy Apply (LinkedIn) rolling 24-hour application cap; once hit, falls back to applying via the company site or queues for the next day (not triggered by the current Workday-only MVP)
easy_apply_daily_limit = 50
# Password generation mode: random (randomly generated) / template (generated from a template rule), used for auto-registration during AUTHENTICATING
password_generation_mode = "random"
# Password template used in template mode; "{rand}" is replaced with a random alphanumeric string; ignored in random mode
password_template = "Deliver{rand}!2026"

[search]
# Job boards passed to JobSpy (North America MVP). Google Jobs is optional; Bayt/Naukri/BDJobs are out of scope.
sites = ["linkedin", "indeed", "glassdoor", "zip_recruiter"]
# Per site per keyword. Caps fetch volume; Layer 1 still uses loose keywords.
results_wanted = 100
hours_old = 72
# Indeed/Glassdoor country. JobSpy accepts "USA" / "usa".
country_indeed = "USA"
# Gate B threshold and LLM shortlist cap.
score_threshold = 0.35
shortlist_cap = 20
llm_rerank = true
# One rerank call for the whole shortlist (not per job). Prefer a cheap model; Opus is too expensive for batches of JDs.
llm_timeout = 180
# Optional overrides so search can use a cheap HTTP API while deliver keeps local Claude CLI.
# llm_transport = "http"
# llm_model = "deepseek-chat"
# Resume-query planner (`search from-resume`) uses the same transport/model overrides.
# Search rerank uses [llm].transport. CLI stdout / HTTP message must be the raw
# {"ranked":[...]} object (optionally in a json fence) — not a PageDecision and not a Claude Code envelope.
# Skip jobs already stored in search_seen within this many hours (default 7 days).
seen_lookback_hours = 168
# Default remote flag when bio `preferences.remote` is unset.
remote = false

[llm]
# How to call the model:
#   "cli"  — run the command below (default: local Claude Code `claude -p`)
#   "http" — OpenAI-compatible Chat Completions. Put the key in .env as LLM_API_KEY
#            and set base_url + model (DeepSeek, OpenAI, Groq, …).
transport = "cli"
# Command for the CLI transport (ignored when transport = "http").
#
# ⚠️ The model text must be the raw business JSON (deliver: PageDecision; search: {"ranked":[...]}).
# Do not use `claude -p --output-format json` — that wraps the payload in a Claude Code envelope.
command = "claude -p"
# Model name. CLI: substituted for {model} in command and passed as LLM_MODEL.
# HTTP: sent as the Chat Completions "model" field (e.g. "deepseek-chat").
model = "claude-opus-4-8"
# HTTP: API host, e.g. "https://api.deepseek.com" or "https://api.openai.com/v1".
# CLI: optional, forwarded to the subprocess as LLM_BASE_URL.
# base_url = "https://api.deepseek.com"
# Timeout in seconds for one CLI run or one HTTP request
timeout = 60

[browser]
# Run headless; set to false during debugging to watch Playwright's actual behavior in a headed browser (Decision 3)
headless = true
# Persistent profile directory (reuses cookies/login state); resolved relative to the repo root; lives under data/ so it's gitignored
user_data_dir = "data/browser_profile"

[imap]
# Read-only mailbox, used to automatically retrieve registration verification codes/links (PRD 6)
host = "imap.gmail.com"
port = 993
# Mailbox folder opened read-only (SELECT/EXAMINE)
mailbox = "INBOX"
# Poll interval and total timeout (seconds) for fetch_code/fetch_link; degrades gracefully on timeout (PRD 5: never blocks the overall pipeline)
poll_interval = 5.0
poll_timeout = 120.0

[capsolver]
# CapSolver captcha-solving service (Decision 6 sub-step: detect type+sitekey → createTask → poll → inject)
# The CAPSOLVER_API_KEY secret goes through an environment variable/.env, not here; captcha handling fails gracefully when unconfigured (PRD 5)
base_url = "https://api.capsolver.com"
poll_interval = 2.0
poll_timeout = 120.0
