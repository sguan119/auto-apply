[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deliver"
version = "0.1.0"
description = "全自动求职投递工具 —— 搜索职位 → 改写简历 → 自动投递"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "playwright",
    "pydantic>=2",
    "typer",
    "pyyaml",
    "python-dotenv",
    "httpx",
    "python-jobspy",  # JobSpy: fetch postings from LinkedIn/Indeed/Glassdoor/ZipRecruiter
    # 邮箱验证码取回：优先用 stdlib imaplib，暂不额外引 imapclient 依赖。
]

[project.optional-dependencies]
dev = [
    "pytest",
    "fastapi",
    "uvicorn",
]
web = [
    "fastapi",
    "uvicorn",
]

[project.scripts]
deliver = "autoapply.cli.main:app"
search = "autoapply.cli.search:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"autoapply.web" = ["*.html"]
